<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出口 IP 一键检测（静态页）</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --ok: #3ecf8e;
      --warn: #f0c14b;
      --err: #ff6b6b;
      --border: #2a3545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
    .sub { margin: 0.4rem 0 0; font-size: 0.85rem; color: var(--muted); max-width: 52rem; }
    main { padding: 1.25rem 1.5rem 3rem; max-width: 960px; margin: 0 auto; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: center; margin-bottom: 1.25rem; }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #334155; color: var(--text); }
    .status { font-size: 0.88rem; color: var(--muted); margin-bottom: 1rem; }
    .pill { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.75rem; margin-left: 0.35rem; }
    .pill.run { background: #1e3a5f; color: #93c5fd; }
    .pill.ok { background: #134e4a; color: #6ee7b7; }
    .pill.err { background: #4c1d1d; color: #fca5a5; }

    .cards { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 1rem 1.15rem;
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1rem; color: #93c5fd; font-weight: 600; }
    .rowline { font-size: 0.82rem; margin: 0.35rem 0; padding: 0.35rem 0; border-bottom: 1px solid var(--border); }
    .rowline:last-child { border-bottom: none; }
    .rowline strong { color: #e2e8f0; }
    .code { color: var(--ok); font-weight: 600; }
    .code.bad { color: var(--err); }
    .snippet { color: #94a3b8; word-break: break-all; margin-top: 0.2rem; font-size: 0.78rem; }

    pre.raw {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #0b0f14;
      border-radius: 8px;
      overflow: auto;
      font-size: 0.72rem;
      color: #94a3b8;
      max-height: 220px;
      border: 1px solid var(--border);
    }

    details.tech { margin-top: 1.5rem; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; background: #141c28; }
    details.tech summary { cursor: pointer; font-weight: 600; color: #cbd5e1; }
    details.tech .inner { margin-top: 0.75rem; font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>出口 IP 一键检测（纯静态）</h1>
    <p class="sub">本页无需本地服务器：用浏览器直接请求各探测 URL。路径为「当前浏览器 + 系统代理」，与命令行里 <code>curl --noproxy '*'</code> 的摘要<strong>不可逐项等同</strong>；需要脚本级对照、完整矩阵时请用 <code>outbound-ip-audit.sh</code> 或 <code>outbound-ip</code>。</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btn-run">一键检测 / 复测</button>
      <button type="button" id="btn-copy-tsv" class="secondary">复制 TSV</button>
    </div>
    <div class="status"><span id="status-msg">就绪。</span><span class="pill run" id="pill">idle</span></div>

    <div id="simple-view" class="cards"></div>

    <details class="tech">
      <summary>技术说明与 TSV</summary>
      <div class="inner">
        <p>部分站点未对浏览器跨域开放（CORS），在本地文件或严格策略下可能显示 HTTP 000 或失败原因；属正常现象。</p>
        <p>场景列固定为 <code>S_browser</code>，仅作留档区分，不代表 shell 里的 S0/S1。</p>
        <pre class="raw" id="raw-tsv"></pre>
      </div>
    </details>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    const CURL_TIMEOUT_MS = 8000;
    const SNIP_MAX = 160;

    const GROUP_ORDER = ["domestic", "intl_plain", "cdn_trace", "meta"];
    const GROUP_LABELS = {
      domestic: "国内 / 中文语境站点",
      intl_plain: "国际通用回显",
      cdn_trace: "CDN 侧观测",
      meta: "HTTP 元数据 (JSON)",
    };

    /** 与 scripts/outbound-ip-audit.sh 中 PROBES 保持一致（parser 同名） */
    const PROBES = [
      { category: "domestic", probe_name: "ipip.net", url: "https://myip.ipip.net", parser: "plain" },
      { category: "domestic", probe_name: "cip.cc", url: "https://cip.cc", parser: "cip_cc_ip" },
      { category: "domestic", probe_name: "ip.cip.cc", url: "http://ip.cip.cc", parser: "plain" },
      { category: "intl_plain", probe_name: "ipecho.net", url: "https://ipecho.net/plain", parser: "plain" },
      { category: "intl_plain", probe_name: "curlmyip", url: "https://curlmyip.com", parser: "plain" },
      { category: "intl_plain", probe_name: "ipify", url: "https://api.ipify.org", parser: "plain" },
      { category: "intl_plain", probe_name: "ipify_v6_hint", url: "https://api64.ipify.org", parser: "plain" },
      { category: "intl_plain", probe_name: "icanhazip", url: "https://icanhazip.com", parser: "plain" },
      { category: "intl_plain", probe_name: "ifconfig.me", url: "https://ifconfig.me/ip", parser: "plain" },
      { category: "intl_plain", probe_name: "ipinfo.io", url: "https://ipinfo.io/ip", parser: "plain" },
      { category: "intl_plain", probe_name: "aws_checkip", url: "https://checkip.amazonaws.com", parser: "plain" },
      { category: "intl_plain", probe_name: "ident.me", url: "https://ident.me", parser: "plain" },
      { category: "cdn_trace", probe_name: "cloudflare_trace", url: "https://1.1.1.1/cdn-cgi/trace", parser: "cloudflare_trace" },
      { category: "meta", probe_name: "httpbin_ip", url: "https://httpbin.org/ip", parser: "httpbin_ip" },
    ];

    const SCENARIO = "S_browser";

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function truncPlain(body) {
      return String(body)
        .replace(/\r\n/g, " ")
        .replace(/\n/g, " ")
        .replace(/^\s+|\s+$/g, "")
        .slice(0, SNIP_MAX);
    }

    function parseSnippet(parser, body) {
      const text = String(body);
      switch (parser) {
        case "plain":
          return truncPlain(text);
        case "cip_cc_ip": {
          const m = text.match(/IP\s*:\s*([\d.]+)/);
          if (m) return m[1].slice(0, SNIP_MAX);
          return truncPlain(text);
        }
        case "cloudflare_trace": {
          const line = text.split(/\r?\n/).find((l) => l.startsWith("ip="));
          return line ? line.replace(/\r/g, "").slice(0, SNIP_MAX) : truncPlain(text);
        }
        case "httpbin_ip":
          try {
            const d = JSON.parse(text);
            return String(d.origin || "").slice(0, SNIP_MAX);
          } catch {
            return truncPlain(text);
          }
        default:
          return truncPlain(text);
      }
    }

    function codeClass(code) {
      const n = parseInt(code, 10);
      if (n >= 200 && n < 300) return "code";
      return "code bad";
    }

    function setPill(text, kind) {
      const pill = $("pill");
      pill.textContent = text;
      pill.className = "pill " + (kind || "run");
    }

    function buildGroups(rows) {
      const buckets = Object.fromEntries(GROUP_ORDER.map((k) => [k, []]));
      for (const r of rows) {
        const cat = r.category || "";
        if (buckets[cat]) buckets[cat].push(r);
      }
      const out = [];
      for (const key of GROUP_ORDER) {
        if (buckets[key].length) out.push({ key, title: GROUP_LABELS[key], rows: buckets[key] });
      }
      return out;
    }

    function renderSimple(groups) {
      const el = $("simple-view");
      if (!groups || !groups.length) {
        el.innerHTML = '<p style="color:var(--muted)">无分组数据</p>';
        return;
      }
      el.innerHTML = groups
        .map((g) => {
          const rows = (g.rows || [])
            .map((r) => {
              const hc = escapeHtml(r.http_code || "");
              return (
                '<div class="rowline">' +
                "<strong>" + escapeHtml(r.probe_name) + "</strong> " +
                '<span class="' + codeClass(hc) + '">HTTP ' + hc + "</span>" +
                '<div class="snippet">' + escapeHtml(r.snippet) + "</div>" +
                '<div class="snippet" style="opacity:0.75">' + escapeHtml(r.url) + "</div>" +
                "</div>"
              );
            })
            .join("");
          return '<section class="card"><h2>' + escapeHtml(g.title) + "</h2>" + rows + "</section>";
        })
        .join("");
    }

    function rowsToTsv(rows) {
      const lines = ["scenario\tcategory\tprobe_name\turl\thttp_code\tsnippet"];
      for (const r of rows) {
        const cells = [SCENARIO, r.category, r.probe_name, r.url, r.http_code, r.snippet].map((c) =>
          String(c ?? "").replace(/\t/g, " ").replace(/\r?\n/g, " ")
        );
        lines.push(cells.join("\t"));
      }
      return lines.join("\n");
    }

    async function runOneProbe(p) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), CURL_TIMEOUT_MS);
      try {
        const res = await fetch(p.url, {
          method: "GET",
          signal: ctrl.signal,
          cache: "no-store",
        });
        const code = String(res.status);
        const text = await res.text();
        let snippet = parseSnippet(p.parser, text);
        if (!snippet && !res.ok) snippet = "HTTP " + code;
        return {
          category: p.category,
          probe_name: p.probe_name,
          url: p.url,
          http_code: code,
          snippet,
        };
      } catch (e) {
        const msg = e && e.name === "AbortError" ? "超时" : String(e.message || e);
        return {
          category: p.category,
          probe_name: p.probe_name,
          url: p.url,
          http_code: "000",
          snippet: msg,
        };
      } finally {
        clearTimeout(timer);
      }
    }

    async function runAudit() {
      const btn = $("btn-run");
      btn.disabled = true;
      setPill("running", "run");
      $("status-msg").textContent = "检测中，请稍候…";
      const t0 = performance.now();
      try {
        const rows = await Promise.all(PROBES.map((p) => runOneProbe(p)));
        const dt = ((performance.now() - t0) / 1000).toFixed(1);
        $("raw-tsv").textContent = rowsToTsv(rows);
        renderSimple(buildGroups(rows));
        $("status-msg").textContent = "完成，耗时 " + dt + " 秒。";
        setPill("ok " + dt + "s", "ok");
      } catch (e) {
        $("simple-view").innerHTML = '<p style="color:var(--err)">' + escapeHtml(String(e)) + "</p>";
        setPill("error", "err");
        $("status-msg").textContent = "异常。";
      } finally {
        btn.disabled = false;
      }
    }

    $("btn-run").addEventListener("click", runAudit);
    $("btn-copy-tsv").addEventListener("click", () => {
      const t = $("raw-tsv").textContent || "";
      if (!t) {
        alert("请先运行检测。");
        return;
      }
      navigator.clipboard.writeText(t).then(
        () => {
          $("btn-copy-tsv").textContent = "已复制";
          setTimeout(() => {
            $("btn-copy-tsv").textContent = "复制 TSV";
          }, 1500);
        },
        () => prompt("复制 TSV", t)
      );
    });

    runAudit();
  </script>
</body>
</html>
