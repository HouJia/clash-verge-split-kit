      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连

  # 📢 场景 · 谷歌推送：FCM 推送服务，避免被 GEOSITE,google 截胡而延迟。
  - name: '📢 场景 · 谷歌推送'
