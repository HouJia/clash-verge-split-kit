  # --- 国家/地区节点分组 ---
  # 基于节点名称关键字筛选，url-test 自动测速选择延迟最优节点。
  # 依赖机场节点命名包含地区标识（如"香港 01"、"日本"、"新加坡"等）。
  # 排除「海外用户专用」节点（避免将海外回国节点误判到地区分组）。
  - name: '🇭🇰 香港节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(香港|HK|Hong Kong)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇯🇵 日本节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(日本|JP|Japan)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇸🇬 新加坡节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(新加坡|SG|Singapore)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🌺 台湾节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(台湾|TW|Taiwan)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇺🇸 美国节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(美国|US|USA|United States)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇰🇷 韩国节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(韩国|KR|Korea|首尔|Seoul)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🌍 其它国家'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)(海外用户专用|香港|HK|Hong Kong|日本|JP|Japan|新加坡|SG|Singapore|台湾|TW|Taiwan|美国|US|USA|United States|韩国|KR|Korea|首尔|Seoul)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50

# --- 外部规则集（rule-providers）---
# 与 GEOSITE,category-ads-all 互补；首次加载后缓存至 path（需可访问外网以下载）
rule-providers:
  reject-loyal:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject-loyal.txt
    interval: 86400

# >>> rulebase:providers

# <<< rulebase:providers

# --- 流量分流规则（rules）---
# 命中顺序自上而下；同一流量只入一个策略组（MECE 原则）
# 先处理私有/局域网 → 广告/遥测 → 业务组 → 国内 → 国外 → 兜底
#
# 规则片段按优先级排列（由 render-local.sh 从 rulesets/_anchors/*.yaml 注入）
# 片段列表：00-private → 10-ads → 20-cursor → 30-ai → 35-messaging → 40-fcm
#            → 45-streaming → 50-dev → 55-scholar → 60-tech-giants → 65-gaming
#            → 70-domestic → 80-geo

rules:
  # __VERGE_INJECT_RULES_START__
  # __VERGE_INJECT_RULES_END__
