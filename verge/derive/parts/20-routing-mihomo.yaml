      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连

  # --- 国家/地区节点分组 ---
  # 基于节点名称关键字筛选，url-test 自动测速选择延迟最优节点。
  # 依赖机场节点命名包含地区标识（如"香港 01"、"日本"、"新加坡"等）。
  # 排除「海外用户专用」节点（避免将海外回国节点误判到地区分组）。
  - name: '🇭🇰 香港节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(香港|HK|Hong Kong)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇯🇵 日本节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(日本|JP|Japan)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇸🇬 新加坡节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(新加坡|SG|Singapore)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🌺 台湾节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(台湾|TW|Taiwan)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇺🇸 美国节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(美国|US|USA|United States)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇰🇷 韩国节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(韩国|KR|Korea|首尔|Seoul)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🌍 其它国家'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)(海外用户专用|香港|HK|Hong Kong|日本|JP|Japan|新加坡|SG|Singapore|台湾|TW|Taiwan|美国|US|USA|United States|韩国|KR|Korea|首尔|Seoul)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50

# --- 外部规则集（rule-providers）---
# 与 GEOSITE,category-ads-all 互补；首次加载后缓存至 path（需可访问外网以下载）
rule-providers:
  reject-loyal:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject-loyal.txt
    interval: 86400

# >>> rulebase:providers

# <<< rulebase:providers

# --- 流量分流规则（rules）---
# 命中顺序自上而下；同一流量只入一个策略组（MECE 原则）
# 先处理私有/局域网 → 广告/遥测 → 业务组 → 国内 → 国外 → 兜底

rules:
  # 私有/局域网：直连
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,192.0.2.1/32,DIRECT,no-resolve

  # 广告与遥测：前置拦截

  - GEOSITE,category-ads-all,🚫 系统 · 广告拦截
  # tracker（统计／上报域）：归入「应用遥测净化」，与展示类广告列表分列，可按需放行排障。
  - GEOSITE,tracker,🍃 系统 · 应用遥测净化
  - RULE-SET,reject-loyal,🚫 系统 · 广告拦截

# >>> rulebase:rules

# <<< rulebase:rules

  # ========== 🔜 工具 · Cursor（PROCESS-NAME 优先于 Azure/CDN；与境外 AI / Microsoft 拆分）==========
  - PROCESS-NAME,Cursor,🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper,🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper (GPU),🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper (Plugin),🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper (Renderer),🔜 工具 · Cursor
  - PROCESS-NAME,Cursor.exe,🔜 工具 · Cursor
  - PROCESS-NAME,cursor,🔜 工具 · Cursor
  # 域名兜底（无进程上下文或旁路由仅用 DOMAIN）
  - DOMAIN-SUFFIX,cursor.com,🔜 工具 · Cursor
  - DOMAIN-SUFFIX,cursor.sh,🔜 工具 · Cursor
  - DOMAIN-SUFFIX,cursor-cdn.com,🔜 工具 · Cursor
