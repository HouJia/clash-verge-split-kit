      - 🎚️ 手动切换
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连

  # 📢 场景 · 谷歌推送：FCM 推送服务，避免被 GEOSITE,google 截胡而延迟。
  - name: '📢 场景 · 谷歌推送'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - ♻️ 自动最优
      - 🎚️ 手动切换
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连

  # 🎬 场景 · 海外音影社：Netflix/Spotify/Discord/Reddit 等流媒体与社区。
  - name: '🎬 场景 · 海外音影社'
