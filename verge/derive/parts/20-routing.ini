custom_proxy_group=地区 · 🇭🇰 香港节点`url-test`(?i)^(?!.*(海外用户专用|原生|isp)).*(香港|HK|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=地区 · 🌺 台湾节点`url-test`(?i)^(?!.*(海外用户专用|原生|isp)).*(台湾|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=地区 · 🇸🇬 新加坡节点`url-test`(?i)^(?!.*(海外用户专用|原生|isp)).*(新加坡|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
