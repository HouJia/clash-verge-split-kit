; 其它国家：排除已定义地区 + 原生/ISP
custom_proxy_group=地区 · 🌍 其它国家`url-test`(?i)^(?!.*(海外用户专用|原生|isp|美国|US|USA|United States|香港|HK|Hong Kong|日本|JP|Japan|新加坡|SG|Singapore|台湾|TW|Taiwan)).*$`http://www.gstatic.com/generate_204`300,,50

; =============================================================================
; 规则集开关
; =============================================================================
enable_rule_generator=true
overwrite_original_rules=true

; =============================================================================
; 外部规则集（Rule Providers）
; 格式：ruleset=策略组名,规则URL 或 ruleset=策略组名,[]本地规则类型,内容
; =============================================================================

; 广告拦截 - Loyalsoldier 规则集
ruleset=系统 · 🚫 广告拦截,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt

; 本地规则片段注入锚点（由 compose-ini.sh 从 rulesets/*.ini 注入）
; >>> RULESET_INJECTION_START
; <<< RULESET_INJECTION_END

; =============================================================================
; 地理分流规则（兜底）
; =============================================================================
; 国内流量（GEOSITE/GEOIP 识别为 CN）
ruleset=底座 · 🔌 国内直连,[]GEOSITE,cn
ruleset=底座 · 🔌 国内直连,[]GEOIP,cn,no-resolve

; 国外流量（非中国大陆地理定位）
ruleset=底座 · 🎚️ 手动切换,[]GEOSITE,geolocation-!cn

; 兜底规则：所有未命中的流量
ruleset=系统 · 🐟 漏网之鱼,[]FINAL
