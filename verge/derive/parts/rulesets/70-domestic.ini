; PayPal 国内门户（先于 GEOSITE,paypal 命中）
ruleset=💳 PayPal · 国内线路,[]DOMAIN-SUFFIX,paypal.cn
ruleset=💳 PayPal · 国内线路,[]DOMAIN-SUFFIX,gopay.com.cn

; PayPal 国际线路
ruleset=💳 PayPal · 国际线路,[]GEOSITE,paypal

; openwrt.ai 文档/镜像站（避免被误判国内直连）
ruleset=🎚️ 手动切换,[]DOMAIN-SUFFIX,openwrt.ai
