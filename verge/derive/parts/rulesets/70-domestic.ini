; 🔌 国内直连
; 国内站点与服务
; 充分利用国内 CDN，固定 DIRECT 避免误走代理

; 国内长视频站点（显式写死，避免误走代理）
ruleset=🔌 国内直连,[]GEOSITE,bilibili
ruleset=🔌 国内直连,[]GEOSITE,youku
ruleset=🔌 国内直连,[]GEOSITE,iqiyi

; 腾讯系（微信/支付/视频/云等）
