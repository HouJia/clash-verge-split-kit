; 地理分流与兜底
; 底座 · 🔌 国内直连 / 底座 · 🎚️ 手动切换 / 系统 · 🐟 漏网之鱼
; GEOSITE/GEOIP 地理分流 + MATCH 兜底

; 国内流量（GEOSITE/GEOIP 识别为 CN）
ruleset=底座 · 🔌 国内直连,[]GEOSITE,cn
ruleset=底座 · 🔌 国内直连,[]GEOIP,cn,no-resolve

; 国外流量（非中国大陆地理定位）
ruleset=底座 · 🎚️ 手动切换,[]GEOSITE,geolocation-!cn

; 兜底规则：所有未命中的流量
ruleset=系统 · 🐟 漏网之鱼,[]FINAL
