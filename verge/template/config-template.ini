; =============================================================================
; 分流策略与规则配置（INI 真值源）
; =============================================================================
; 本文件为 subconverter/Sub-Store 兼容的 INI 格式配置
; 设计原则：
;   - 底座组（🎚️ 手动切换、♻️ 自动最优）提供出口选择
;   - 🔌 国内直连作为统一直连出口，所有业务组均可切换至该组
;   - 业务组按场景划分（AI、游戏、影音、开发等），便于按需切换策略
;   - 系统组（广告拦截、遥测净化、漏网之鱼）处理特殊流量
; =============================================================================

[custom]
; =============================================================================
; 策略组定义（Proxy Groups）
; 格式：custom_proxy_group=名称`类型`节点匹配`选项1`选项2`...
;   - select: 手动选择，选项用 [] 包裹表示引用其他组
;   - url-test: 自动测速，格式为 url-test`匹配`测速URL`间隔`容差
; =============================================================================

; ------------------- 底座策略组 -------------------
; ♻️ 自动最优：url-test 测速，自动选择延迟最低的节点
custom_proxy_group=♻️ 自动最优`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 🔌 国内直连：国内流量统一出口
custom_proxy_group=🔌 国内直连`select`[]DIRECT`[]♻️ 自动最优

; 🎚️ 手动切换：手动选择出口，包含所有地区节点
custom_proxy_group=🎚️ 手动切换`select`[]♻️ 自动最优`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; ------------------- 业务场景策略组 -------------------
; 🔜 工具 · Cursor：Cursor IDE 专用组
custom_proxy_group=🔜 工具 · Cursor`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 🧠 场景 · 境外 AI：OpenAI/ChatGPT/Claude 等境外 AI 服务，默认美国节点优先
custom_proxy_group=🧠 场景 · 境外 AI`select`.*`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🎚️ 手动切换`[]♻️ 自动最优`[]🔌 国内直连

; 💬 场景 · 即时通讯：Telegram/WhatsApp/Line 等
custom_proxy_group=💬 场景 · 即时通讯`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 📢 场景 · 谷歌推送：FCM 推送服务
custom_proxy_group=📢 场景 · 谷歌推送`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 🎬 场景 · 海外音影社：Netflix/Spotify/Discord/Reddit 等流媒体与社区
custom_proxy_group=🎬 场景 · 海外音影社`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 📱 场景 · TikTok：单独拆分，默认美国节点
custom_proxy_group=📱 场景 · TikTok`select`.*`[]🇺🇸 美国节点`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 🐙 场景 · 开发源站：GitHub/Docker/npm/PyPI 等
custom_proxy_group=🐙 场景 · 开发源站`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 📚 场景 · 学术与数据：学术论文与数据库站点
custom_proxy_group=📚 场景 · 学术与数据`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 🎮 场景 · 游戏平台：Steam/Epic/PlayStation/Xbox/Nintendo 等
custom_proxy_group=🎮 场景 · 游戏平台`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 💳 PayPal · 国内线路：paypal.cn 等国内支付场景，默认直连
custom_proxy_group=💳 PayPal · 国内线路`select`.*`[]🔌 国内直连`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家

; 💳 PayPal · 国际线路：paypal.com 等国际支付场景
custom_proxy_group=💳 PayPal · 国际线路`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; ------------------- 大厂策略组 -------------------
; 🍎 大厂 · 苹果：Apple/iCloud/iTunes/更新服务，国内 CDN 友好，默认直连
custom_proxy_group=🍎 大厂 · 苹果`select`.*`[]🔌 国内直连`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家

; 🪟 大厂 · 微软：Microsoft/OneDrive/LinkedIn/Xbox，默认直连
custom_proxy_group=🪟 大厂 · 微软`select`.*`[]🔌 国内直连`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家

; 💠 大厂 · 微软跨境：Copilot/Bing AI 等跨境服务，默认代理优先
custom_proxy_group=💠 大厂 · 微软跨境`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 🔍 大厂 · 谷歌：Google/YouTube/Gmail 等，默认美国节点
custom_proxy_group=🔍 大厂 · 谷歌`select`.*`[]🇺🇸 美国节点`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 👥 大厂 · 脸书系：Meta/Facebook/Instagram/Threads
custom_proxy_group=👥 大厂 · 脸书系`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; ------------------- 系统策略组 -------------------
; 🚫 系统 · 广告拦截：GEOSITE,category-ads-all + reject-loyal 规则命中
custom_proxy_group=🚫 系统 · 广告拦截`select`.*`[]REJECT`[]🎚️ 手动切换`[]♻️ 自动最优`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 🍃 系统 · 应用遥测净化：GEOSITE,tracker 命中，与广告分开便于灰度放行
custom_proxy_group=🍃 系统 · 应用遥测净化`select`.*`[]REJECT`[]🎚️ 手动切换`[]♻️ 自动最优`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; 🐟 系统 · 漏网之鱼：MATCH 兜底，所有未命中规则的流量最终走此组
custom_proxy_group=🐟 系统 · 漏网之鱼`select`.*`[]♻️ 自动最优`[]🎚️ 手动切换`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌺 台湾节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🌍 其它国家`[]🔌 国内直连

; ------------------- 国家/地区节点分组 -------------------
; 基于节点名称关键字筛选，url-test 自动测速选择延迟最优节点
; 排除「海外用户专用」节点（避免将海外回国节点误判到地区分组）
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|HK|Hong Kong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|JP|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|SG|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌺 台湾节点`url-test`(台湾|TW|Taiwan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美国|US|USA|United States)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(韩国|KR|Korea|首尔|Seoul)`http://www.gstatic.com/generate_204`300,,50
; 其它国家：排除已定义的地区节点
custom_proxy_group=🌍 其它国家`url-test`^(?!.*(?:海外用户专用|香港|HK|Hong Kong|日本|JP|Japan|新加坡|SG|Singapore|台湾|TW|Taiwan|美国|US|USA|United States|韩国|KR|Korea|首尔|Seoul)).*$`http://www.gstatic.com/generate_204`300,,50

; =============================================================================
; 规则集开关
; =============================================================================
enable_rule_generator=true
overwrite_original_rules=true

