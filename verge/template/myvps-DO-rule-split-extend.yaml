# Clash Verge — **扩展分流规则与策略**（静态：`dns` / `geodata` / `sniffer` / `proxy-groups` / `rules`；**不含** `proxies`）
# **文件：** `myvps-DO-rule-split-extend.yaml`（个人/专用稿；文件名 `VERGE_EXTEND_FILE`）
# **与主线：** 仓库默认渲染 `airport-rule-split-extend.yaml`；渲染本稿请：`VERGE_EXTEND_FILE=myvps-DO-rule-split-extend.yaml bash verge/scripts/render-local.sh …`
# 模板：`YOUR_VPS_IP` 为占位符。**勿**将已填入真实 IP 的全文提交进 Git。
# 流程：钩子或手动渲染后写入 **`verge/generated/myvps-DO-rule-split.local.yaml`**（规则：`*-extend.yaml` → `*.local.yaml`）；亦可仅设 `VERGE_EXTEND_FILE` 后运行 `bash verge/scripts/render-local.sh`。
# **可选：** 在同一目录放置 `verge/generated/local/override.local`（`[rules-before-cn]` 段，勿提交仓库），在向 `GEOSITE,cn` 过渡前注入自定义 rule 片段。语法见 `override.local.example` 与 `verge/scripts/render-local.sh` 注释。
# 将生成文件全文复制到 Verge **全局扩展配置**。
# 文档：https://www.clashverge.dev/guide/extend.html
#
# --- MECE：先定分组，再挂规则（命中顺序自上而下；同一流量只入一个业务组）---
# 1) 底座「🌍 节点选择」：`include-all-proxies` 汇入订阅节点在前，末项 `DIRECT` 供排障；`select` 未写 `default` 时首项为默认，故默认走订阅节点而非直连（仅出站节点，不含其它策略组）。
# 2) 默认入口「🏠 全球直连」：DIRECT | 底座。
# 3) 业务组（规则显式命中）：「🔜 工具 · Cursor」「🧠 场景 · 境外 AI」「👥 大厂 · 脸书系」「🎬 场景 · 追剧听歌与海外社区」「🐙 场景 · 开发源站」「📚 场景 · 学术与数据」「🔍 大厂 · 谷歌」「🍎 大厂 · 苹果」「💳 PayPal · 国内线路」「💳 PayPal · 国际线路」「💠 大厂 · 微软跨境」「🪟 大厂 · 微软」— 工具与脸书系及追剧听歌与海外社区 / 开发 / 学术 / 谷歌组可选用 DIRECT；💠（微软跨境）默认代理优先；🍎 / 🪟 大厂组默认 DIRECT；PayPal 两组均为 select（国内默认 DIRECT、国际默认节点）；🧠 场景 · 境外 AI 默认底座，可选用 DIRECT。
# 4) 系统组：「🚫 系统 · 广告拦截」；「🐟 系统 · 漏网之鱼」承接 MATCH。
#
# rules 顺序：私有/广告（含远端 RULE-SET）→ 🔜 工具 · Cursor → … → 💠 大厂 · 微软跨境 carve-out（先于 GEOSITE,microsoft）→ 谷歌 / 苹果 / 🪟 大厂 · 微软 → …
# 稳妥分流思路：关键业务用 DOMAIN/DOMAIN-SUFFIX 写死；CDN **以域名为准**。数据源为 meta-rules-dat / v2fly domain-list-community 编译产物时，`GEOSITE,microsoft` 等大类内含大量微软系子列表（如 Azure、OneDrive、Skype、Xbox）；与 GitHub 的标签在源数据里可能交叉，但 **`GEOSITE,github`**（网页/Git/API）、**`ghcr.io`、`npm.pkg.github.com`** 已由「🐙 场景 · 开发源站」**先于** `GEOSITE,microsoft` 命中；未被子域规则摘走的流量才依 geosite 归入「🪟 大厂 · 微软」桶。另：`dns.fake-ip-filter` 收录常规 GitHub 域，降低浏览器/`git` 在 fake-ip 下解析出 `198.18.*` 后的握手异常。
# PROCESS-NAME：仅本机 Mihomo + TUN/ebpf 能关联进程时生效；旁路由常无进程名。Windows：`Cursor.exe`；macOS 常见 Helper 进程名如下（不匹配则仍可依赖 DOMAIN 规则）。

mode: rule
log-level: info
ipv6: true

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  use-hosts: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 专用于解析代理服务器（节点）域名的 DNS，返回真实 IP
  # 解决 Verge 节点测试超时问题：节点域名用真实 IP，其他域名走 fake-ip
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - tls://8.8.8.8:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    # GitHub：跳过 fake-ip，解析真实 IP；出站仍由下方 GEOSITE,github 等规则走代理（避免误以为「直连」或 TLS 异常）。
    - '+.github.com'
    - '+.githubusercontent.com'
    - '+.githubassets.com'

proxy-groups:
  # 底座：订阅节点在前（默认选中），DIRECT 殿后供临时直连排障；仅含节点，不含其它策略组。
  - name: '🌍 节点选择'
    type: select
    include-all-proxies: true
    proxies:
      - DIRECT
  - name: '🏠 全球直连'
    type: select
    proxies:
      - DIRECT
      - '🌍 节点选择'
  # 工具 · Cursor：🔜 大号箭头标（Unicode 无 OS 指针字形）；可走代理或直连（与本组 rules 搭配）。
  - name: '🔜 工具 · Cursor'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  # 场景 · 境外 AI：列表首项「节点选择」为默认；末项 DIRECT 供临时直连排障。
  - name: '🧠 场景 · 境外 AI'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  - name: '👥 大厂 · 脸书系'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  - name: '🎬 场景 · 追剧听歌与海外社区'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  - name: '🐙 场景 · 开发源站'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  - name: '📚 场景 · 学术与数据'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  # PayPal：国内门户与国际站分两组，便于在 Verge 里切换直连/节点（风控与连通性自负）。
  - name: '💳 PayPal · 国内线路'
    type: select
    proxies:
      - DIRECT
      - '🌍 节点选择'
  - name: '💳 PayPal · 国际线路'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  # 🍎 大厂 · 苹果：默认直连优先，可选节点。
  - name: '🍎 大厂 · 苹果'
    type: select
    proxies:
      - DIRECT
      - '🌍 节点选择'
  - name: '🪟 大厂 · 微软'
    type: select
    proxies:
      - DIRECT
      - '🌍 节点选择'
  - name: '💠 大厂 · 微软跨境'
    type: select
    proxies:
      - '🌍 节点选择'
      - '🏠 全球直连'
  - name: '🔍 大厂 · 谷歌'
    type: select
    proxies:
      - '🌍 节点选择'
      - DIRECT
  - name: '🚫 系统 · 广告拦截'
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: '🐟 系统 · 漏网之鱼'
    type: select
    proxies:
      - '🌍 节点选择'
      - '🏠 全球直连'

rule-providers:
  # 与 GEOSITE,category-ads-all 互补；remote 由 Mihomo 缓存至 path
  reject-loyal:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject-loyal.txt
    interval: 86400

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,YOUR_VPS_IP/32,DIRECT,no-resolve

  - GEOSITE,category-ads-all,🚫 系统 · 广告拦截
  # tracker：meta-rules-dat 的 geosite.dat 收录；category-privacy 在该数据源中不存在，Verge 校验会失败
  - GEOSITE,tracker,🚫 系统 · 广告拦截
  - RULE-SET,reject-loyal,🚫 系统 · 广告拦截

  # ========== 🔜 工具 · Cursor（PROCESS-NAME 优先于 Azure/CDN；与境外 AI / Microsoft 拆分）==========
  - PROCESS-NAME,Cursor,🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper,🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper (GPU),🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper (Plugin),🔜 工具 · Cursor
  - PROCESS-NAME,Cursor Helper (Renderer),🔜 工具 · Cursor
  - PROCESS-NAME,Cursor.exe,🔜 工具 · Cursor
  - PROCESS-NAME,cursor,🔜 工具 · Cursor
  # 域名兜底（无进程上下文或旁路由仅用 DOMAIN）
  - DOMAIN-SUFFIX,cursor.com,🔜 工具 · Cursor
  - DOMAIN-SUFFIX,cursor.sh,🔜 工具 · Cursor
  - DOMAIN-SUFFIX,cursor-cdn.com,🔜 工具 · Cursor
  - DOMAIN-SUFFIX,cursorapi.com,🔜 工具 · Cursor

  # ========== 🧠 场景 · 境外 AI — OpenAI / ChatGPT / Codex ==========
  # 域名对齐 OpenAI Help Center「Network recommendations」：https://help.openai.com/en/articles/9247338-network-recommendations-for-chatgpt-errors-on-web-and-apps
  # Codex CLI 默认 API：`api.openai.com`（见 openai/codex init_firewall.sh）；WebSocket 等走 chatgpt.com 路径。
  # IP：无官方全量静态 IPv4；语音 UDP 见 https://openai.com/chatgpt-voice.json 。
  - DOMAIN-SUFFIX,openai.com,🧠 场景 · 境外 AI
  - DOMAIN-SUFFIX,chatgpt.com,🧠 场景 · 境外 AI
  - DOMAIN-SUFFIX,chat.openai.com,🧠 场景 · 境外 AI
