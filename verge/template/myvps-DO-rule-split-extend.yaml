  - DOMAIN-SUFFIX,auth.openai.com,🧠 场景 · 境外 AI
  - DOMAIN,auth0.openai.com,🧠 场景 · 境外 AI
  - DOMAIN,setup.auth.openai.com,🧠 场景 · 境外 AI
  - DOMAIN-SUFFIX,openaimerge.com,🧠 场景 · 境外 AI
  - DOMAIN-SUFFIX,cdn.openaimerge.com,🧠 场景 · 境外 AI
