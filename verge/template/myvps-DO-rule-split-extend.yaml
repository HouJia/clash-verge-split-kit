  # ========== 📚 场景 · 学术与数据（`GEOSITE,category-scholar-!cn`）==========
  # 运行时不展开为「逐条 DOMAIN」：由 geosite.dat 按标签整体匹配。上游源文件见：
  #   https://github.com/v2fly/domain-list-community/blob/master/data/category-scholar-!cn
  # 该文件先 `include:` 多块子列表（再在编译期合并进同一标签），子列表包括但不限于：
  #   category-scholar-ir, category-scholar-uk, apa, clarivate, doi, elsevier,
  #   google-scholar, ieee, mit, proquest, sci-hub, sciencedirect, springer,
  #   taylorfrancis, z-library …（各 include 自己又含大量域名/全文规则）
  # 源文件本体还列有数百学术/高校/期刊平台域（节选举例：arxiv.org, nature.com, science.org,
  # ieee.org→见 ieee 子列表, ebscohost.com, jstor.org, semanticscholar.org …）；**全貌以官方仓库递归展开为准**。
  # **必须**排在 GEOSITE,google 前，否则 scholar.google.* 会先落「🔍 大厂 · 谷歌」组。
  - GEOSITE,category-scholar-!cn,📚 场景 · 学术与数据

  # ========== 🔍 大厂 · 谷歌（GEOSITE + geosite 无独立列表时的邮箱补丁）==========
