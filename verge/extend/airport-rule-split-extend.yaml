# --- MECE：先定分组，再挂规则（命中顺序自上而下；同一流量只入一个业务组）---
# 1) 底座「🎚️ 手动切换」：滑动调节器图标，像扳道岔一样手动选择出口。`include-all-proxies` 汇入订阅节点，末项 `🔌 国内直连` 供排障；`select` 未写 `default` 时首项为默认，故默认走订阅节点而非直连。
# 2) 自动底座「♻️ 自动最优」：url-test 测速，自动选择延迟最低的节点。
# 3) 默认入口「🔌 国内直连」：插头图标，DIRECT + ♻️ 自动最优。国内域名/IP（GEOSITE,cn / GEOIP,cn）固定走此组。
# 4) 业务组（规则显式命中）：「🔜 工具 · Cursor」「🧠 场景 · 境外 AI」「👥 大厂 · 脸书系」「🎬 场景 · 追剧听歌与海外社区」「🐙 场景 · 开发源站」「📚 场景 · 学术与数据」「🔍 大厂 · 谷歌」「🍎 大厂 · 苹果」「💳 PayPal · 国内线路」「💳 PayPal · 国际线路」「💠 大厂 · 微软跨境」「🪟 大厂 · 微软」「🎮 场景 · 游戏平台」— 所有业务组均可切换至 🔌 国内直连。
# 5) 系统组：**「🚫 系统 · 广告拦截」**拦截展示类广告/联盟等大集合；**「🍃 系统 · 应用遥测净化」**承接统计／上报／tracker 等与「纯广告清单」分列，便于面板灰度放行；「🐟 系统 · 漏网之鱼」承接 MATCH。
#
# rules 顺序：私有/局域网 → 广告大集合与应用遥测（含远端 RULE-SET）→ 🔜 工具 · Cursor → … → 💠 大厂 · 微软跨境 carve-out（先于 GEOSITE,microsoft）→ 谷歌 / 苹果 / 🪟 大厂 · 微软 → …
# 稳妥分流思路：关键业务用 DOMAIN/DOMAIN-SUFFIX 写死；CDN **以域名为准**。数据源为 meta-rules-dat / v2fly domain-list-community 编译产物时，`GEOSITE,microsoft` 等大类内含大量微软系子列表（如 Azure、OneDrive、Skype、Xbox）；与 GitHub 的标签在源数据里可能交叉，但 **`GEOSITE,github`**（网页/Git/API）、**`ghcr.io`、`npm.pkg.github.com`** 已由「🐙 场景 · 开发源站」**先于** `GEOSITE,microsoft` 命中；未被子域规则摘走的流量才依 geosite 归入「🪟 大厂 · 微软」桶。另：`dns.fake-ip-filter` 收录常规 GitHub 域，降低浏览器/`git` 在 fake-ip 下解析出 `198.18.*` 后的握手异常。
# PROCESS-NAME：仅本机 Mihomo + TUN/ebpf 能关联进程时生效；旁路由常无进程名。Windows：`Cursor.exe`；macOS 常见 Helper 进程名如下（不匹配则仍可依赖 DOMAIN 规则）。

# =============================================================================
# Mihomo/Clash Verge 运行时壳配置（基础运行时参数）
# =============================================================================
# 本文件定义：
#   - 代理模式、日志级别、IPv6 支持
#   - GeoIP/Geosite 数据源与自动更新
#   - 流量嗅探器（SNI 识别）
#   - DNS 配置（fake-ip 模式、国内外分流解析）
# 
# 与 20-routing-mihomo.yaml 合并后生成完整配置。
# 详见：verge/derive/README.md
# =============================================================================

mode: rule
log-level: info
ipv6: true

# --- Geo 数据库配置 ---
# 使用 geodata-mode 而非 classical-mode，内存占用更低
# 每日自动更新 geo 数据库，确保分流准确性
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24

# GeoIP/Geosite/Mmdb 数据源（MetaCubeX 社区维护，每日自动编译）
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

# --- 流量嗅探器（SNI 识别）---
# 启用后可根据 TLS/QUIC 握手信息识别真实域名，绕过 fake-ip 限制
# 用于：TLS SNI 识别、HTTP Host 头重写、QUIC 流量分流
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# --- DNS 配置 ---
# 采用 fake-ip 模式，域名先解析为 198.18.x.x 虚拟 IP，再由 Mihomo 进行域名分流
# 优点：规避 DNS 污染、支持进程级分流、减少真实 DNS 查询次数
# 缺点：部分应用需要 fake-ip-filter 才能正常工作
# 
# 注意：proxy-server-nameserver 用于解析代理服务器域名，必须返回真实 IP
dns:
  enable: true
  use-hosts: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 专用于解析代理服务器（节点）域名的 DNS，返回真实 IP
  # 解决 Verge 节点测试超时问题：节点域名用真实 IP，其他域名走 fake-ip
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 默认 DNS：国内 DoH（DNSPod + 阿里云），解析国内域名快速稳定
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # Fallback DNS：国外 DoH/DoT（Cloudflare + Google），当国内无法解析时启用
  fallback:
    - https://dns.cloudflare.com/dns-query
    - tls://8.8.8.8:853
  # Fallback 触发条件：
  # - 当解析结果 IP 为 CN 且 geoip-code 匹配时，优先使用国内 DNS
  # - 保留 240.0.0.0/4（保留地址段）和 0.0.0.0/32 走 fallback
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    # fake-ip-filter：指定域名不使用 fake-ip，返回真实 IP
  # GitHub 相关域：跳过 fake-ip 避免 TLS 握手异常，但出站仍由规则走代理
    - '+.github.com'
    - '+.githubusercontent.com'
    - '+.githubassets.com'
# =============================================================================
# Mihomo/Clash Verge 分流策略与规则配置（骨架版）
# =============================================================================
# 本文件定义：
#   - proxy-groups：策略组（底座组、业务组、系统组、地区节点组）
#   - rule-providers：外部规则集（如 reject-loyal）
#   - rules：流量分流规则骨架（具体规则由 render-local.sh 注入）
#
# 设计原则：
#   - 底座组（🎚️ 手动切换、♻️ 自动最优）提供出口选择
#   - 🔌 国内直连作为统一直连出口，所有业务组均可切换至该组
#   - 业务组按场景划分（AI、游戏、影音、开发等），便于按需切换策略
#   - 系统组（广告拦截、遥测净化、漏网之鱼）处理特殊流量
#   - 避免 ProxyGroup 循环引用（🎚️ 手动切换 → 🔌 国内直连，单向依赖）
#
# 规则片段位于 verge/rulesets/_anchors/*.yaml
# 由 render-local.sh 组装为最终产物
# =============================================================================

proxy-groups:
  # --- 底座策略组 ---
  # ♻️ 自动最优：url-test 测速，自动选择延迟最低的节点。作为底座组的默认首项。
  - name: '♻️ 自动最优'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50

  # 🔌 国内直连：插头图标，国内流量统一出口。包含 DIRECT + ♻️ 自动最优。
  - name: '🔌 国内直连'
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动最优

  # 🎚️ 手动切换：滑动调节器图标，像扳道岔一样手动选择出口。
  - name: '🎚️ 手动切换'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - '♻️ 自动最优'
      - '🇭🇰 香港节点'
      - '🇯🇵 日本节点'
      - '🇸🇬 新加坡节点'
      - '🌺 台湾节点'
      - '🇺🇸 美国节点'
      - '🇰🇷 韩国节点'
      - '🌍 其它国家'
      - 🔌 国内直连

  # --- 业务场景策略组 ---
  # 🔜 工具 · Cursor：Cursor IDE 专用组，包含所有节点 + 🔌 国内直连选项。
  - name: '🔜 工具 · Cursor'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - ♻️ 自动最优
      - 🎚️ 手动切换
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连

  # 🧠 场景 · 境外 AI：OpenAI/ChatGPT/Claude 等境外 AI 服务，默认美国节点优先。
  - name: '🧠 场景 · 境外 AI'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - 🇺🇸 美国节点
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🎚️ 手动切换
      - ♻️ 自动最优
      - 🔌 国内直连

  # 💬 场景 · 即时通讯：Telegram/WhatsApp/Line 等，默认自动测速选最优。
