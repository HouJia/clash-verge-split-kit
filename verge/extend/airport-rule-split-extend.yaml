      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
  # 💠 大厂 · 微软跨境：Copilot/Bing AI 等跨境服务，默认代理优先。
  - name: '💠 大厂 · 微软跨境'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - ♻️ 自动最优
      - 🎚️ 手动切换
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连
  # 🔍 大厂 · 谷歌：Google/YouTube/Gmail 等，GEOSITE,google 兜底。
  - name: '🔍 大厂 · 谷歌'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - 🇺🇸 美国节点
      - ♻️ 自动最优
      - 🎚️ 手动切换
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连
  # 👥 大厂 · 脸书系：Meta/Facebook/Instagram/Threads，GEOSITE,meta 兜底。
  - name: '👥 大厂 · 脸书系'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - ♻️ 自动最优
      - 🎚️ 手动切换
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连

  # --- 系统策略组 ---
  # 🚫 系统 · 广告拦截：GEOSITE,category-ads-all + reject-loyal 规则命中。
  - name: '🚫 系统 · 广告拦截'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - REJECT
      - 🎚️ 手动切换
      - ♻️ 自动最优
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连
  # 🍃 系统 · 应用遥测净化：GEOSITE,tracker 命中，与广告分开便于灰度放行。
  - name: '🍃 系统 · 应用遥测净化'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - REJECT
      - 🎚️ 手动切换
      - ♻️ 自动最优
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连
  # 🐟 系统 · 漏网之鱼：MATCH 兜底，所有未命中规则的流量最终走此组。
  - name: '🐟 系统 · 漏网之鱼'
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    proxies:
      - ♻️ 自动最优
      - 🎚️ 手动切换
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🌺 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其它国家
      - 🔌 国内直连

  # --- 国家/地区节点分组 ---
  # 基于节点名称关键字筛选，url-test 自动测速选择延迟最优节点。
  # 依赖机场节点命名包含地区标识（如"香港 01"、"日本"、"新加坡"等）。
  # 排除「海外用户专用」节点（避免将海外回国节点误判到地区分组）。
  - name: '🇭🇰 香港节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(香港|HK|Hong Kong)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇯🇵 日本节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(日本|JP|Japan)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇸🇬 新加坡节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(新加坡|SG|Singapore)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🌺 台湾节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(台湾|TW|Taiwan)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇺🇸 美国节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(美国|US|USA|United States)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🇰🇷 韩国节点'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)海外用户专用'
    filter: '(?i)(韩国|KR|Korea|首尔|Seoul)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50
  - name: '🌍 其它国家'
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)(海外用户专用|香港|HK|Hong Kong|日本|JP|Japan|新加坡|SG|Singapore|台湾|TW|Taiwan|美国|US|USA|United States|韩国|KR|Korea|首尔|Seoul)'
    url: 'http://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 50

# --- 外部规则集（rule-providers）---
# 与 GEOSITE,category-ads-all 互补；首次加载后缓存至 path（需可访问外网以下载）
rule-providers:
  reject-loyal:
    type: http
    behavior: domain
    format: text
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/reject-loyal.txt
    interval: 86400

