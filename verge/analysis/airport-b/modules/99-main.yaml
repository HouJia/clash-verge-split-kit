# 机场B配置模块化汇总
# ====================
# 本文件为 机场B Clash 配置的模块化拆分汇总说明
# 源文件: ori-airport-b-rule-split.local.yaml
#
# 使用方式:
# 1. 合并以下模块文件（按编号顺序）
# 2. 在 Clash Verge 中使用「全局扩展配置」功能
# 3. 或使用 Mihomo 的 rule-providers 动态加载

# -----------------------------------------------------------------------------
# 模块文件清单（按优先级/合并顺序）
# -----------------------------------------------------------------------------

# 基础配置（原文件包含，但未单独拆分）:
#   - port: 7890
#   - socks-port: 7891
#   - allow-lan: false
#   - mode: Rule
#   - log-level: info
#   - external-controller: 127.0.0.1:9090
#   - unified-delay: true
#   - DNS 配置（阿里云 DNS）

# 代理节点: 47 个节点（36 付费 + 7 免费日本节点）
#   - 香港节点 11 个
#   - 日本节点 18 个（含 7 个免费节点）
#   - 新加坡节点 3 个
#   - 台湾节点 1 个
#   - 美国节点 2 个
#   - 其他节点 8 个（英国/阿根廷/俄罗斯/土耳其/韩国/印度/德国/加拿大/澳大利亚/法国/乌克兰）

# 模块文件列表（按合并顺序）:
#   1. 20-proxy-groups.yaml   - 策略组定义（11 个策略组）
#   2. 30-rules-ads.yaml       - 广告拦截（1,596 条）
#   3. 40-rules-ai.yaml        - AI 服务（机场B 无此分组，空占位）
#   4. 45-rules-streaming.yaml - 流媒体（17 条）
#   5. 50-rules-social.yaml    - 社交媒体（机场B 无此分组，空占位）
#   6. 55-rules-services.yaml  - 云服务与学术（67 条）
#   7. 60-rules-gaming.yaml    - 游戏平台（21 条）
#   8. 65-rules-proxy.yaml     - 一般代理（7,116 条）
#   9. 70-rules-geo.yaml       - 地理位置与兜底（746 条）

# -----------------------------------------------------------------------------
# 策略组清单（按优先级）
# -----------------------------------------------------------------------------

# 高优先级:
#   - 🛑 拦截广告      -> REJECT / DIRECT
#   - 🔰 选择节点      -> 全部 47 个节点 + DIRECT

# 中优先级（特定场景）:
#   - 🌏 爱奇艺&哔哩哔哩 -> DIRECT / 香港节点 / 台湾节点
#   - 📺 动画疯        -> 🔰 选择节点 / 台湾节点 / DIRECT
#   - 🎮 Steam 登录/下载 -> DIRECT / 🔰 选择节点 / 低价区节点
#   - 🎮 Steam 商店/社区 -> 🔰 选择节点 / 低价区节点 / DIRECT
#   - 🌩️ Cloudflare   -> 🔰 选择节点 / DIRECT
#   - ☁️ OneDrive      -> 🔰 选择节点 / DIRECT / 日本节点
#   - 🎓学术网站       -> DIRECT / 🔰 选择节点

# 低优先级（兜底）:
#   - 🇨🇳 国内网站      -> DIRECT / 🔰 选择节点
#   - 🐟 漏网之鱼      -> 🔰 选择节点 / DIRECT

# -----------------------------------------------------------------------------
# 与 airport-a 配置的主要差异
# -----------------------------------------------------------------------------

# 1. 规则规模:
#    - 机场A: ~52,000 条（广告拦截 44,000+）
#    - 机场B:     ~9,800 条（广告拦截 1,600+，精简很多）

# 2. 策略组设计:
#    - 机场A: 26 个策略组，细分业务场景
#    - 机场B:     11 个策略组，更精简，大量规则直接走 🔰 选择节点

# 3. 分流粒度:
#    - 机场A: 广告/AI/流媒体/社交/服务/游戏/代理/地理 分层明确
#    - 机场B:     大部分境外域名直接走 🔰 选择节点，分组较粗

# 4. 适用场景:
#    - 机场A: 追求精细化分流，广告拦截严格
#    - 机场B:     追求简洁，规则加载更快，适合轻度使用

# -----------------------------------------------------------------------------
# 合并命令示例
# -----------------------------------------------------------------------------

# Bash 合并（按编号顺序）:
#   cat 20-proxy-groups.yaml > merged.yaml
#   cat 30-rules-ads.yaml >> merged.yaml
#   cat 40-rules-ai.yaml >> merged.yaml
#   cat 45-rules-streaming.yaml >> merged.yaml
#   cat 50-rules-social.yaml >> merged.yaml
#   cat 55-rules-services.yaml >> merged.yaml
#   cat 60-rules-gaming.yaml >> merged.yaml
#   cat 65-rules-proxy.yaml >> merged.yaml
#   cat 70-rules-geo.yaml >> merged.yaml

# 验证合并结果:
#   grep -c "^- " merged.yaml
#   # 应输出约 9,563 条（允许少量误差）

