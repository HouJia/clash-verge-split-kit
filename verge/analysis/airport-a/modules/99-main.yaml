#---------------------------------------------------#
## 模块化 Clash 配置文件
## 更新时间: 2026-05-06
## 说明: 本配置由 clash-after-phase03.local.yaml 拆分而来
##       按业务逻辑分为多个子模块，便于管理和维护
#---------------------------------------------------#

# HTTP 代理端口
port: 7890

# SOCKS5 代理端口
socks-port: 7891

# Linux 和 macOS 的 redir 代理端口
redir-port: 7892

# 允许局域网的连接
allow-lan: true

# 规则模式：Rule（规则） / Global（全局代理）/ Direct（全局直连）
mode: rule

# 设置日志输出级别
log-level: silent

# Clash 的 RESTful API
external-controller: '0.0.0.0:9090'

# RESTful API 的口令
secret: ''

# ============================================
# 代理节点配置 (proxies)
# ============================================
# 通过引用外部文件加载

proxies:
  # 代理节点定义在此文件中
  # 文件: 10-proxies.yaml
  # 请将此文件内容合并到此处或使用 Clash 的 include 功能

# ============================================
# 代理策略组 (proxy-groups)
# ============================================
# 通过引用外部文件加载

proxy-groups:
  # 策略组定义在此文件中
  # 文件: 20-proxy-groups.yaml
  # 请将此文件内容合并到此处或使用 Clash 的 include 功能

# ============================================
# 规则配置 (rules)
# ============================================
# 按业务逻辑分层，自上而下首条命中
# 加载顺序: 特殊 > 广告 > 应用 > 流媒体 > 社交 > 服务 > 游戏 > 代理 > 直连 > 兜底

rules:
  # --- 第1层: 特殊网站与官网访问 (高优先级) ---
  # 文件: 25-rules-special.yaml
  # 包含: 订阅服务官网、特殊域名

  # --- 第2层: AI服务 ---
  # 文件: 40-rules-ai.yaml
  # 包含: ChatGPT, Claude, OpenAI等

  # --- 第3层: 广告拦截 ---
  # 文件: 30-rules-ads.yaml
  # 包含: 广告域名、广告IP
  # 注意: 此模块规则数量最多(~44,000条)，影响性能可酌情删减

  # --- 第4层: 应用净化 ---
  # 文件: 35-rules-telemetry.yaml
  # 包含: 应用遥测、数据统计、追踪器

  # --- 第5层: 流媒体平台 ---
  # 文件: 45-rules-streaming.yaml
  # 包含: Youtube, Netflix, Bilibili等

  # --- 第6层: 社交媒体 ---
  # 文件: 50-rules-social.yaml
  # 包含: Telegram, Twitter等

  # --- 第7层: 邮件与云服务 ---
  # 文件: 55-rules-services.yaml
  # 包含: Gmail, 微软服务, 苹果服务

  # --- 第8层: 游戏平台 ---
  # 文件: 60-rules-gaming.yaml
  # 包含: Steam, Epic等

  # --- 第9层: 节点选择 (一般代理) ---
  # 文件: 65-rules-proxy.yaml
  # 包含: 需要代理的通用域名

  # --- 第10层: 地理位置分流 ---
  # 文件: 70-rules-geo.yaml
  # 包含: 中国IP直连(GEOIP,CN)、其他IP规则

  # --- 第11层: 兜底规则 ---
  # 文件: 70-rules-geo.yaml
  # 包含: MATCH规则 (必须最后)

# ============================================
# 使用说明
# ============================================
# 1. Clash Verge 用户:
#    在"全局扩展配置"或"订阅配置"中引用各模块文件
#
# 2. Mihomo/Clash Meta 用户:
#    可使用 proxy-providers 和 rule-providers 动态加载
#
# 3. 传统 Clash 用户:
#    需要手动将各模块内容合并到主配置文件
#
# 4. 规则优先级说明:
#    - 域名类规则(DOMAIN/DOMAIN-SUFFIX/DOMAIN-KEYWORD)优先匹配
#    - IP类规则(IP-CIDR/GEOIP)在域名解析后匹配
#    - MATCH 规则必须放在最后作为兜底
#
# ============================================
# 文件清单
# ============================================
# 00-core.yaml           - 基础配置(端口、API、日志)
# 10-proxies.yaml        - 代理节点列表
# 20-proxy-groups.yaml   - 策略组定义
# 25-rules-special.yaml  - 特殊网站规则
# 30-rules-ads.yaml      - 广告拦截规则 (~44,000条)
# 35-rules-telemetry.yaml- 应用净化规则 (~950条)
# 40-rules-ai.yaml       - AI服务规则 (15条)
# 45-rules-streaming.yaml- 流媒体规则 (~280条)
# 50-rules-social.yaml   - 社交媒体规则 (~20条)
# 55-rules-services.yaml - 邮件/云服务规则 (~40条)
# 60-rules-gaming.yaml   - 游戏平台规则 (~28条)
# 65-rules-proxy.yaml    - 节点选择规则 (~5,900条)
# 70-rules-geo.yaml      - 地理位置与兜底规则
# 99-main.yaml           - 本文件(配置汇总说明)
# ============================================
