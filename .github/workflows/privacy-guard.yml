name: Privacy Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    name: 隐私信息泄漏扫描
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Privacy Guard scan
        run: |
          echo "🔒 Privacy Guard: 启动云端扫描..."
          
          # 创建临时文件存储 commit message
          TEMP_DIR=$(mktemp -d)
          trap "rm -rf $TEMP_DIR" EXIT
          
          # 获取要扫描的提交范围
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commits=$(git log --format=%H ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            commits=$(git log --format=%H -n 10)
          fi
          
          EXIT_CODE=0
          
          # 扫描每个 commit 的 message
          for commit in $commits; do
            msg_file="$TEMP_DIR/$commit.txt"
            git log -1 --pretty=%B "$commit" > "$msg_file"
            
            if ! bash verge/scripts/privacy-guard.sh message "$msg_file"; then
              echo "❌ Commit ${commit:0:7} 扫描失败" >&2
              EXIT_CODE=1
            fi
          done
          
          # 扫描文件内容
          if ! bash verge/scripts/privacy-guard.sh files; then
            echo "❌ 文件内容扫描失败" >&2
            EXIT_CODE=1
          fi
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Privacy Guard: 云端扫描通过"
          else
            echo ""
            echo "🚫 Privacy Guard: 发现潜在的隐私泄漏！" >&2
            echo "请修改后重新提交" >&2
            exit 1
          fi
